name: QA
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validation syntaxe JS
        run: |
          for f in assets/js/*.js tests/*.js; do
            [ -f "$f" ] && node --check "$f" && echo "OK $f"
          done
      - name: Validation structure HTML
        run: |
          for f in *.html; do
            grep -q "<!DOCTYPE html>" "$f" && echo "OK $f" || { echo "DOCTYPE manquant: $f"; exit 1; }
          done
      - name: Tests unitaires (Node, sans dépendance)
        run: |
          [ -f tests/test-unitaires.js ] && node tests/test-unitaires.js || echo "pas de tests unitaires — ignoré"
