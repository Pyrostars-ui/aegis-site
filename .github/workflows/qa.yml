name: QA
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validation syntaxe JS
        run: |
          for f in assets/js/*.js; do node --check "$f" && echo "OK: $f"; done
      - name: Validation HTML de base
        run: |
          for f in *.html; do grep -q '<!DOCTYPE html>' "$f" && echo "OK: $f"; done
